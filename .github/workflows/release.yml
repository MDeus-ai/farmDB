name: farmDB Release

on:
  push:
    tags:
      - 'farmDB-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:desktop

  release-desktop-windows:
    name: Build & Publish Windows Installer + Updater
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md or git log
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Trim()
          $clean = $tag -replace '^(?i)farmdb[-_]?', '' -replace '^(?i)v', ''
          $parts = @()
          if ($clean -match '(\d+(?:\.\d+)*)') {
            $parts = $Matches[1].Split('.') | Select-Object -First 3
          }
          while ($parts.Count -lt 3) { $parts += '0' }
          $ver = ($parts -join '.')

          $notes = ""
          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md"
            $escapedVer = [regex]::Escape($ver)
            $inSection = $false
            $captured = New-Object System.Collections.Generic.List[string]
            foreach ($line in $lines) {
              if ($line -match "^\s*##\s+\[?v?$escapedVer\]?\b") {
                $inSection = $true
                continue
              }
              if ($inSection -and $line -match "^\s*##\s+") {
                break
              }
              if ($inSection) {
                $captured.Add($line)
              }
            }
            $notes = ($captured -join "`n").Trim()
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $prevTag = $null
            if ($tag) {
              $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
            }
            if ($prevTag) {
              $commits = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges -n 12
            } else {
              $commits = git log -n 8 --pretty=format:"- %s" --no-merges
            }
            if ($commits) {
              $notes = "### Changes in v$ver`n" + ($commits -join "`n")
            }
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Offline-first farmDB Desktop Windows installers and signed auto-updater packages."
          }

          "body<<EOF_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF_NOTES" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: npm ci

      - name: Sync release version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Trim()
          $clean = $tag -replace '^(?i)farmdb[-_]?', '' -replace '^(?i)v', ''
          $parts = @()
          if ($clean -match '(\d+(?:\.\d+)*)') {
            $parts = $Matches[1].Split('.') | Select-Object -First 3
          }
          while ($parts.Count -lt 3) { $parts += '0' }
          $ver = ($parts -join '.')
          if ($ver -ne '0.0.0') {
            $updatesTs = Get-Content "packages/core/src/updates.ts" -Raw
            $updatesTs = $updatesTs -replace "export const FARMDB_APP_VERSION = '[^']+';", "export const FARMDB_APP_VERSION = '$ver';"
            Set-Content "packages/core/src/updates.ts" $updatesTs -NoNewline

            $tauriConf = Get-Content "apps/desktop/src-tauri/tauri.conf.json" | ConvertFrom-Json
            $tauriConf.version = $ver
            $tauriConf | ConvertTo-Json -Depth 16 | Set-Content "apps/desktop/src-tauri/tauri.conf.json"

            $cargo = Get-Content "apps/desktop/src-tauri/Cargo.toml" -Raw
            $cargo = $cargo -replace '(?m)^version = "[^"]+"', "version = `"$ver`""
            Set-Content "apps/desktop/src-tauri/Cargo.toml" $cargo -NoNewline

            $pkg = Get-Content "apps/desktop/package.json" | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 16 | Set-Content "apps/desktop/package.json"
          }

      - name: Build Tauri Windows release & upload updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'farmDB (${{ github.ref_name }})'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

  publish-mobile-ota:
    name: Publish Expo Mobile OTA Update
    needs: verify
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN secret
        id: check_token
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check_token.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stamp FARMDB_APP_VERSION from git tag (preserve app.json OTA version)
        if: steps.check_token.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = (process.env.GITHUB_REF_NAME || "").trim().replace(/^farmdb[-_]?/i, "").replace(/^v/i, "");
            const m = raw.match(/(\d+(?:\.\d+)*)/);
            if (!m) process.exit(0);
            const parts = m[1].split(".").slice(0, 3);
            while (parts.length < 3) parts.push("0");
            const ver = parts.join(".");
            if (ver === "0.0.0") process.exit(0);
            const file = "packages/core/src/updates.ts";
            const src = fs.readFileSync(file, "utf8").replace(/export const FARMDB_APP_VERSION = \x27[^\x27]+\x27;/, `export const FARMDB_APP_VERSION = \x27${ver}\x27;`);
            fs.writeFileSync(file, src, "utf8");
          '

      - if: steps.check_token.outputs.configured == 'true'
        run: npm ci

      - name: Publish OTA update to EAS production channel
        if: steps.check_token.outputs.configured == 'true'
        working-directory: apps/mobile
        run: npx --yes eas-cli update --branch production --non-interactive --message "Release ${{ github.ref_name }}"

  attach-android-apk:
    name: Attach Android APK to GitHub Release
    needs: [release-desktop-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN secret
        id: check_token
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.check_token.outputs.configured == 'true'
        run: npm ci

      - name: Fetch latest Android APK (EAS or previous GitHub Release) and upload
        shell: bash
        run: |
          set -euo pipefail
          APK_OUT="/tmp/farmDB-android.apk"
          rm -f "$APK_OUT"

          is_valid_apk() {
            [ -f "$APK_OUT" ] && node -e '
              const fs = require("fs");
              const p = process.argv[1];
              const st = fs.statSync(p);
              if (st.size < 1000000) process.exit(1);
              const fd = fs.openSync(p, "r");
              const b = Buffer.alloc(2);
              fs.readSync(fd, b, 0, 2, 0);
              fs.closeSync(fd);
              if (b[0] !== 0x50 || b[1] !== 0x4b) process.exit(1);
            ' "$APK_OUT"
          }

          extract_apk_url() {
            EAS_RAW="$1" node -e '
              const raw = process.env.EAS_RAW || "";
              const idx = raw.indexOf("[");
              if (idx === -1) process.exit(0);
              let list = [];
              try { list = JSON.parse(raw.slice(idx)); } catch { process.exit(0); }
              const now = Date.now();
              const found = list.find((b) => {
                const u = b?.artifacts?.applicationArchiveUrl || b?.artifacts?.buildUrl || "";
                if (!/\.apk(\?.*)?$/i.test(u)) return false;
                if (b?.expirationDate && Date.parse(b.expirationDate) <= now) return false;
                return true;
              });
              if (found) {
                process.stdout.write(found.artifacts.applicationArchiveUrl || found.artifacts.buildUrl || "");
              }
            ' || true
          }

          if [ -n "${EXPO_TOKEN:-}" ]; then
            RAW_JSON=$(cd apps/mobile && npx --yes eas-cli build:list --platform android --build-profile production --status finished --limit 5 --json --non-interactive 2>/tmp/eas-err.log || true)
            if [ -z "$RAW_JSON" ] || ! echo "$RAW_JSON" | grep -q '\['; then
              echo "EAS production build:list stderr:"
              cat /tmp/eas-err.log || true
            fi
            APK_URL=$(extract_apk_url "$RAW_JSON")

            if [ -z "$APK_URL" ]; then
              RAW_JSON=$(cd apps/mobile && npx --yes eas-cli build:list --platform android --status finished --limit 5 --json --non-interactive 2>/tmp/eas-err.log || true)
              if [ -z "$RAW_JSON" ] || ! echo "$RAW_JSON" | grep -q '\['; then
                echo "EAS fallback build:list stderr:"
                cat /tmp/eas-err.log || true
              fi
              APK_URL=$(extract_apk_url "$RAW_JSON")
            fi

            if [ -n "$APK_URL" ]; then
              echo "Downloading Android APK from Expo EAS: $APK_URL"
              if curl -fSL --retry 3 -o "$APK_OUT" "$APK_URL" && is_valid_apk; then
                echo "Verified valid Android APK from Expo EAS."
              else
                rm -f "$APK_OUT"
              fi
            fi
          fi

          if ! is_valid_apk; then
            echo "Checking previous GitHub Releases for cached farmDB-android.apk..."
            RELEASES_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=25" 2>/dev/null || echo "[]")
            PREV_TAG=$(REL_JSON="$RELEASES_JSON" CUR_TAG="${GITHUB_REF_NAME}" node -e '
              let list = [];
              try { list = JSON.parse(process.env.REL_JSON || "[]"); } catch { process.exit(0); }
              const cur = process.env.CUR_TAG || "";
              const match = list.find(
                (r) => r && r.tag_name && r.tag_name !== cur && Array.isArray(r.assets) && r.assets.some((a) => a && a.name === "farmDB-android.apk")
              );
              if (match) process.stdout.write(match.tag_name);
            ' || true)

            if [ -n "$PREV_TAG" ]; then
              echo "Downloading farmDB-android.apk from previous release $PREV_TAG..."
              if gh release download "$PREV_TAG" --pattern "farmDB-android.apk" --output "$APK_OUT" && is_valid_apk; then
                echo "Verified valid farmDB-android.apk carried forward from $PREV_TAG."
              else
                rm -f "$APK_OUT"
              fi
            fi
          fi

          if is_valid_apk; then
            gh release upload "${GITHUB_REF_NAME}" "$APK_OUT" --clobber
            echo "Uploaded farmDB-android.apk to release ${GITHUB_REF_NAME}."
          else
            echo "::warning::No non-expired EAS Android APK or previous farmDB-android.apk asset found; skipping APK attachment."
          fi
